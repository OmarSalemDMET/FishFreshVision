[package]
name = "rust-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
opencv = { version = "0.101", features = ["clang-runtime"] }
anyhow = "1.0"
tonic = "0.11"
prost = "0.12"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
rustfft = "6.1"
serde = { version = "1.0.229", features = ["derive"] }

[build-dependencies]
tonic-build = "0.11"
